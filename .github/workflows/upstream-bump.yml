name: upstream-bump

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check upstream releases
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The emulator and the launcher are released separately, and their
          # versions can differ. releases/latest skips prereleases, so FS-UAE 5
          # alphas are ignored until upstream marks one stable.
          changed=false
          for project in fs-uae fs-uae-launcher; do
            case "${project}" in
              fs-uae) arg=FS_UAE; out=emulator;;
              *) arg=FS_UAE_LAUNCHER; out=launcher;;
            esac
            release=$(gh api "repos/FrodeSolheim/${project}/releases/latest")
            version=$(printf '%s' "${release}" | jq -r .tag_name)
            sha=$(printf '%s' "${release}" \
              | jq -r --arg name "${project}-${version#v}.tar.xz" \
                '.assets[] | select(.name == $name) | .digest' \
              | sed 's/^sha256://')
            case "${version}${sha}" in
              *null*|"") echo "cannot resolve ${project} release" >&2; exit 1;;
            esac
            current=$(sed -n "s/^ARG ${arg}_VERSION=//p" Dockerfile)
            [ "${version}" = "${current}" ] || changed=true
            sed -i \
              -e "s|^ARG ${arg}_VERSION=.*|ARG ${arg}_VERSION=${version}|" \
              -e "s|^ARG ${arg}_SHA256=.*|ARG ${arg}_SHA256=${sha}|" Dockerfile
            echo "${out}=${version}" >> "${GITHUB_OUTPUT}"
          done
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      # PRs opened with GITHUB_TOKEN do not start workflow runs, so the new pin
      # is built and tested here instead of on the pull request.
      - uses: docker/setup-buildx-action@v4
        if: steps.up.outputs.changed == 'true'

      - name: build
        if: steps.up.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fs-uae:bump
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        if: steps.up.outputs.changed == 'true'
        run: tests/smoke.sh fs-uae:bump ${{ steps.up.outputs.emulator }}

      - name: open pull request
        if: steps.up.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: fs-uae-${{ steps.up.outputs.emulator }}-launcher-${{ steps.up.outputs.launcher }}
          commit-message: "FS-UAE ${{ steps.up.outputs.emulator }}, Launcher ${{ steps.up.outputs.launcher }}"
          title: "FS-UAE ${{ steps.up.outputs.emulator }}, Launcher ${{ steps.up.outputs.launcher }}"
          body: |
            Pin FS-UAE
            [${{ steps.up.outputs.emulator }}](https://github.com/FrodeSolheim/fs-uae/releases/tag/${{ steps.up.outputs.emulator }})
            and FS-UAE Launcher
            [${{ steps.up.outputs.launcher }}](https://github.com/FrodeSolheim/fs-uae-launcher/releases/tag/${{ steps.up.outputs.launcher }}).

            Built and smoke tested in
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }});
            `ci` does not run on pull requests opened by `GITHUB_TOKEN`.

            Merging releases an image versioned after the emulator; a launcher
            only bump refreshes the images at the current emulator version.
          delete-branch: true
